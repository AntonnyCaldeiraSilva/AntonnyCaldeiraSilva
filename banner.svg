<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Antonny Caldeira, Design Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a1c"/><stop offset=".55" stop-color="#1a1442"/><stop offset="1" stop-color="#0c1a2e"/></linearGradient>
<linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#c4b5fd"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
<filter id="bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="45"/></filter>
<pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
<clipPath id="cp"><rect width="1200" height="340" rx="28"/></clipPath>
</defs>
<style>
.b1{animation:f1 9s ease-in-out infinite}.b2{animation:f2 11s ease-in-out infinite}.b3{animation:f1 13s ease-in-out infinite reverse}
@keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,34px)}}
@keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-30px)}}
.t{opacity:0;animation:cy 9s infinite}.t2{animation-delay:3s}.t3{animation-delay:6s}
@keyframes cy{0%{opacity:0;transform:translateY(10px)}5%,28%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-6px)}}
.cur{animation:bk 1s steps(1) infinite}@keyframes bk{50%{opacity:0}}
</style>
<g clip-path="url(#cp)">
<rect width="1200" height="340" fill="url(#bg)"/>
<circle class="b1" cx="220" cy="70" r="150" fill="#7c3aed" opacity=".55" filter="url(#bl)"/>
<circle class="b2" cx="1000" cy="270" r="170" fill="#06b6d4" opacity=".38" filter="url(#bl)"/>
<circle class="b3" cx="640" cy="30" r="110" fill="#ec4899" opacity=".28" filter="url(#bl)"/>
<rect width="1200" height="340" fill="url(#gr)"/>
<text x="70" y="150" font-family="'Segoe UI','Inter',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#nm)">Antonny Caldeira</text>
<text x="72" y="196" font-family="'Segoe UI','Inter',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="7" fill="#a5b4fc">DESIGN ENGINEER</text>
<g font-family="'Segoe UI','Inter',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="23" fill="#e2e8f0">
<text class="t" x="72" y="246">Do Figma ao código, sem atrito no hand-off</text>
<text class="t t2" x="72" y="246">Interfaces acessíveis e Design Systems escaláveis</text>
<text class="t t3" x="72" y="246">Rigor de engenharia com ergonomia de produto</text>
</g>
<text x="72" y="300" font-family="'Segoe UI','Inter',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8">Sistemas de Informação @ IFMG  ·  Ouro Branco, MG</text>
<g>
<rect x="790" y="58" width="340" height="224" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
<circle cx="816" cy="82" r="6" fill="#f87171"/><circle cx="836" cy="82" r="6" fill="#fbbf24"/><circle cx="856" cy="82" r="6" fill="#34d399"/>
<line x1="790" x2="1130" y1="104" y2="104" stroke="#fff" stroke-opacity=".08"/>
<g font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">
<text x="816" y="140"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> antonny </tspan><tspan fill="#94a3b8">= {</tspan></text>
<text x="840" y="173"><tspan fill="#67e8f9">design</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fde68a">'Figma · WCAG'</tspan><tspan fill="#94a3b8">,</tspan></text>
<text x="840" y="206"><tspan fill="#67e8f9">code</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fde68a">'Vue 3 · Rust'</tspan><tspan fill="#94a3b8">,</tspan></text>
<text x="840" y="239"><tspan fill="#67e8f9">handoff</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">'zero atrito'</tspan><tspan fill="#94a3b8">,</tspan></text>
<text x="816" y="268" fill="#94a3b8">}</text>
<rect class="cur" x="836" y="254" width="9" height="18" fill="#a78bfa"/>
</g></g>
<rect x="1" y="1" width="1198" height="338" rx="27" fill="none" stroke="#fff" stroke-opacity=".1"/>
</g></svg>