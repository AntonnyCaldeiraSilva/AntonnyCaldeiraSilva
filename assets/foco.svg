<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -25 1200 280" width="100%" height="auto" style="overflow: visible;" role="img" aria-label="Design com rigor, engenharia de verdade e visão ponta a ponta">
  <defs>
    <linearGradient id="a0" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="a1" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="a2" x1="0" x2="1">
      <stop offset="0" stop-color="#34d399" />
      <stop offset="1" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <style>
    /* Configuração base dos cards */
    .card {
      transform-box: fill-box;
      transform-origin: center center;
      animation-duration: 1.2s;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      animation-fill-mode: forwards;
      /* Vincula à rolagem se estiver em página web moderna */
      animation-timeline: view();
      animation-range: entry 10% cover 45%;
    }

    /* Card 1: Sai do meio inclinado (-14deg) e abre para a esquerda */
    .card-left {
      animation-name: fanOutLeft;
    }

    /* Card 2: Fica no centro e ganha escala */
    .card-center {
      animation-name: fanOutCenter;
    }

    /* Card 3: Sai do meio inclinado (+14deg) e abre para a direita */
    .card-right {
      animation-name: fanOutRight;
    }

    @keyframes fanOutLeft {
      0% {
        transform: translate(412px, 20px) rotate(-14deg);
        opacity: 0.5;
      }
      100% {
        transform: translate(0px, 0px) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes fanOutCenter {
      0% {
        transform: translate(412px, 10px) scale(0.96);
        opacity: 0.8;
      }
      100% {
        transform: translate(412px, 0px) scale(1);
        opacity: 1;
      }
    }

    @keyframes fanOutRight {
      0% {
        transform: translate(412px, 20px) rotate(14deg);
        opacity: 0.5;
      }
      100% {
        transform: translate(824px, 0px) rotate(0deg);
        opacity: 1;
      }
    }
  </style>

  <!-- Card 1: Design com rigor -->
  <g class="card card-left">
    <rect width="376" height="230" rx="20" fill="#0f172a" />
    <rect x=".5" y=".5" width="375" height="229" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".09" />
    <rect x="24" y="0" width="96" height="4" rx="2" fill="url(#a0)" />
    <text x="28" y="56" font-family="&#39;Segoe UI&#39;,&#39;Inter&#39;,system-ui,-apple-system,Roboto,sans-serif" font-size="23" font-weight="700" fill="url(#a0)">Design com rigor</text>
    <circle cx="34" cy="99" r="3.5" fill="#a78bfa" /><text x="50" y="104" font-family="&#39;Segoe UI&#39;,&#39;Inter&#39;,system-ui,-apple-system,Roboto,sans-serif" font-size="16.5" fill="#cbd5e1">Figma, Design Systems e tokens</text>
    <circle cx="34" cy="137" r="3.5" fill="#a78bfa" /><text x="50" y="142" font-family="&#39;Segoe UI&#39;,&#39;Inter&#39;,system-ui,-apple-system,Roboto,sans-serif" font-size="16.5" fill="#cbd5e1">Acessibilidade WCAG AA e AAA</text>
    <circle cx="34" cy="175" r="3.5" fill="#a78bfa" /><text x="50" y="180" font-family="&#39;Segoe UI&#39;,&#39;Inter&#39;,system-ui,-apple-system,Roboto,sans-serif" font-size="16.5" fill="#cbd5e1">UX e heurísticas de Nielsen</text>
  </g>

  <!-- Card 2: Engenharia de verdade -->
  <g class="card card-center">
    <rect width="376" height="230" rx="20" fill="#0f172a" />
    <rect x=".5" y=".5" width="375" height="229" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".09" />
    <rect x="24" y="0" width="96" height="4" rx="2" fill="url(#a1)" />
    <text x="28" y="56" font-family="&#39;Segoe UI&#39;,&#39;Inter&#39;,system-ui,-apple-system,Roboto,sans-serif" font-size="23" font-weight="700" fill="url(#a1)">Engenharia de verdade</text>
    <circle cx="34" cy="99" r="3.5" fill="#22d3ee" /><text x="50" y="104" font-family="&#39;Segoe UI&#39;,&#39;Inter&#39;,system-ui,-apple-system,Roboto,sans-serif" font-size="16.5" fill="#cbd5e1">Vue 3, TypeScript e Tailwind</text>
    <circle cx="34" cy="137" r="3.5" fill="#22d3ee" /><text x="50" y="142" font-family="&#39;Segoe UI&#39;,&#39;Inter&#39;,system-ui,-apple-system,Roboto,sans-serif" font-size="16.5" fill="#cbd5e1">Rust, Java e Spring Boot</text>
    <circle cx="34" cy="175" r="3.5" fill="#22d3ee" /><text x="50" y="180" font-family="&#39;Segoe UI&#39;,&#39;Inter&#39;,system-ui,-apple-system,Roboto,sans-serif" font-size="16.5" fill="#cbd5e1">Docker, PostgreSQL e Redis</text>
  </g>

  <!-- Card 3: Visão ponta a ponta -->
  <g class="card card-right">
    <rect width="376" height="230" rx="20" fill="#0f172a" />
    <rect x=".5" y=".5" width="375" height="229" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".09" />
    <rect x="24" y="0" width="96" height="4" rx="2" fill="url(#a2)" />
    <text x="28" y="56" font-family="&#39;Segoe UI&#39;,&#39;Inter&#39;,system-ui,-apple-system,Roboto,sans-serif" font-size="23" font-weight="700" fill="url(#a2)">Visão ponta a ponta</text>
    <circle cx="34" cy="99" r="3.5" fill="#34d399" /><text x="50" y="104" font-family="&#39;Segoe UI&#39;,&#39;Inter&#39;,system-ui,-apple-system,Roboto,sans-serif" font-size="16.5" fill="#cbd5e1">Do negócio à infraestrutura</text>
    <circle cx="34" cy="137" r="3.5" fill="#34d399" /><text x="50" y="142" font-family="&#39;Segoe UI&#39;,&#39;Inter&#39;,system-ui,-apple-system,Roboto,sans-serif" font-size="16.5" fill="#cbd5e1">Design e código, mesma língua</text>
    <circle cx="34" cy="175" r="3.5" fill="#34d399" /><text x="50" y="180" font-family="&#39;Segoe UI&#39;,&#39;Inter&#39;,system-ui,-apple-system,Roboto,sans-serif" font-size="16.5" fill="#cbd5e1">Hand-off sem atrito</text>
  </g>
</svg>
