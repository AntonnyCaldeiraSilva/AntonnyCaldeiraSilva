<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" width="600" height="210" role="img" aria-label="conect-tool, dois computadores, um único sistema" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1030"/><stop offset="1" stop-color="#1b1147"/></linearGradient>
<linearGradient id="tt" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
<clipPath id="cp"><rect width="600" height="210" rx="24"/></clipPath></defs>
<style>.hop{animation:hp 3.2s ease-in-out infinite}@keyframes hp{0%{transform:translateX(0);opacity:0}15%{opacity:1}70%{opacity:1}100%{transform:translateX(138px);opacity:0}}
.ln{stroke-dasharray:4 6;animation:dm 1.4s linear infinite}@keyframes dm{to{stroke-dashoffset:-20}}
.dot{animation:pl 1.8s ease-in-out infinite}@keyframes pl{50%{opacity:.25}}</style>
<g clip-path="url(#cp)">
<rect width="600" height="210" fill="url(#bg)"/>
<circle cx="520" cy="30" r="90" fill="#6366f1" opacity=".18"/>
<circle class="dot" cx="42" cy="36" r="5" fill="#fbbf24"/>
<text x="56" y="40" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#fcd34d">EM DESENVOLVIMENTO</text>
<text x="36" y="92" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="url(#tt)">conect-tool</text>
<g font-family="'Segoe UI','Inter',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#cbd5e1"><text x="36" y="124">Dois computadores.</text><text x="36" y="148">Um único sistema.</text></g>
<rect x="36" y="164" width="60" height="30" rx="15.0" fill="#1e1b4b" stroke="#818cf8" stroke-opacity=".55"/><text x="66.0" y="183.55" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#c7d2fe">Rust</text><rect x="106" y="164" width="92" height="30" rx="15.0" fill="#1e1b4b" stroke="#818cf8" stroke-opacity=".55"/><text x="152.0" y="183.55" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#c7d2fe">Wayland</text><rect x="208" y="164" width="92" height="30" rx="15.0" fill="#1e1b4b" stroke="#818cf8" stroke-opacity=".55"/><text x="254.0" y="183.55" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#c7d2fe">Windows</text>
<g>
<rect x="318" y="58" width="104" height="70" rx="10" fill="#0b1226" stroke="#818cf8" stroke-opacity=".7" stroke-width="2"/>
<rect x="454" y="58" width="104" height="70" rx="10" fill="#0b1226" stroke="#22d3ee" stroke-opacity=".7" stroke-width="2"/>
<line class="ln" x1="422" x2="454" y1="93" y2="93" stroke="#a5b4fc" stroke-width="2"/>
<rect class="hop" x="332" y="76" width="34" height="24" rx="5" fill="#a78bfa"/>
<text x="370" y="148" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#94a3b8">linux</text>
<text x="506" y="148" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#94a3b8">windows</text>
</g></g>
<rect x="1" y="1" width="598" height="208" rx="23" fill="none" stroke="#818cf8" stroke-opacity=".25"/>
</svg>